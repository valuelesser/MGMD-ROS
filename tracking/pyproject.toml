[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint -p no:ament_copyright"
markers = [
    "gpu: requires a JAX GPU device (deselect with '-m \"not gpu\"')",
    "integration: end-to-end integration tests",
]
